plugins {
    id 'com.android.application'
}

android {
    namespace 'com.josjis.tv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.josjis.tv'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '1.0.3'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Zero third-party app dependencies: native Android Views + WebView.
